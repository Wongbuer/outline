name: Sync upstream

# 把上游 outline/outline 的 main 同步到本仓库的 upstream-main 分支（纯净镜像，勿手改）。
# 定制只在 main；更新时手动 merge origin/upstream-main -> main。
#
# 需要仓库 secret：UPSTREAM_SYNC_TOKEN
# - classic PAT：repo + workflow
# - 或 fine-grained PAT：Contents Read and write + Workflows Read and write（本仓库）
# 原因：上游若改了 .github/workflows/*，GITHUB_TOKEN 无权创建/更新 workflow 文件。

on:
  schedule:
    - cron: "0 4 * * *" # 每天 UTC 04:00
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream main -> upstream-main
    runs-on: ubuntu-latest
    steps:
      - name: Require UPSTREAM_SYNC_TOKEN
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UPSTREAM_SYNC_TOKEN}" ]; then
            echo "::error::Missing secret UPSTREAM_SYNC_TOKEN. Create a PAT with repo+workflow (or fine-grained Contents+Workflows write) and add it as a repository secret."
            exit 1
          fi

      - name: Fetch upstream and push to upstream-main
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git clone --bare "https://github.com/outline/outline.git" upstream.git
          cd upstream.git
          git push --force \
            "https://x-access-token:${UPSTREAM_SYNC_TOKEN}@github.com/Wongbuer/outline.git" \
            refs/heads/main:refs/heads/upstream-main
          echo "synced outline/outline main -> Wongbuer/outline upstream-main"
