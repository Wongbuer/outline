name: Build Dex theme image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dex-theme.yml"
      - "deploy/.dockerignore"
      - "deploy/Dockerfile.dex"
      - "deploy/dex-gitee-icon.css"
      - "deploy/dex-gitee-icon.svg"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: dex-theme-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wongbuer/dex-gitee
  IMAGE_TAG: v2.41.1-1

jobs:
  build:
    name: Build and push (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::7}"

          docker build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.dex \
            --tag "${image}:${IMAGE_TAG}" \
            --tag "${image}:sha-${short_sha}" \
            deploy
          docker push "${image}:${IMAGE_TAG}"
          docker push "${image}:sha-${short_sha}"
